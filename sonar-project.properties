# Configuration SonarQube pour HealthAI Coach API

# Informations du projet
sonar.projectKey=healthai-coach-api
sonar.projectName=HealthAI Coach API
sonar.projectVersion=1.0.0

# Chemins des sources
sonar.sources=src/main/java
sonar.java.binaries=target/classes

# Chemins des tests
sonar.tests=src/test/java
sonar.test.inclusions=**/*Test.java,**/*Tests.java

# Exclusions
sonar.exclusions=**/config/**,**/dto/**,**/entity/**,**/*Application.java
sonar.coverage.exclusions=**/config/**,**/dto/**,**/entity/**,**/*Application.java

# Rapports de couverture
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Encodage
sonar.sourceEncoding=UTF-8

# Version Java
sonar.java.source=21

# Quality Gates
# Ces valeurs sont définies dans SonarQube UI mais documentées ici:
# - Code Coverage: minimum 80%
# - Bugs critiques: 0
# - Code Duplication: maximum 3%
# - Security Hotspots: 0 non revus
# - Maintainability Rating: A (dette technique < 5%)

# Paramètres de duplication
sonar.cpd.exclusions=**/dto/**,**/entity/**
