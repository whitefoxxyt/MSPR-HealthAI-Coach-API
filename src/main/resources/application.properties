spring.application.name=HealthAi-Coach-API

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthai}
spring.datasource.username=${DB_USER:healthai_user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Force camelCase → snake_case mapping (fatG → fat_g, carbsG → carbs_g, etc.)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway - Désactivé car migrations gérées par MSPR-HealthAI-Coach-BDD
spring.flyway.enabled=false
# Les migrations SQL sont centralisées dans le repo BDD
# Voir: MSPR-HealthAI-Coach-BDD/migrations/

# Security & JWT - Secret partagé avec le service Auth (BETTER_AUTH_SECRET)
app.jwt.secret=${BETTER_AUTH_SECRET}

# CORS - Origine autorisée (Dashboard)
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# Server
server.port=${API_PORT:8080}
server.servlet.context-path=/api

# Logging
logging.level.root=INFO
logging.level.fr.epsi=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ETL report path (shared read-only volume from ETL container)
etl.report.path=${ETL_REPORT_PATH:/app/etl-data/processed/quality_report.json}

