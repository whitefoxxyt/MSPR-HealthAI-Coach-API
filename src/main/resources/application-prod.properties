spring.application.name=HealthAi-Coach-API

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthai}
spring.datasource.username=${DB_USER:healthai_user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=true

# Security & JWT
app.jwt.secret=${JWT_SECRET:changeme_replace_with_a_long_random_secret_key_min_32_chars}
app.jwt.expiration=86400000

# Server
server.port=${API_PORT:8080}
server.servlet.context-path=/api

# Logging
logging.level.root=INFO
logging.level.fr.epsi=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

